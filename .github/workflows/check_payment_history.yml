name: Automatisation Quotidienne des Messages

on:
  schedule:
    # S'exécute automatiquement tous les jours à 08h00 du matin (heure UTC)
    - cron: '0 8 * * *'
  # Permet aussi de pouvoir le lancer manuellement en un clic depuis l'onglet "Actions" de GitHub
  workflow_dispatch:

jobs:
  tache-quotidienne-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v3

      - name: Exécuter la routine quotidienne des messages
        run: |
          echo "=== Lancement de la vérification quotidienne des messages ==="
          # Vous pouvez placer ici des commandes ou un script Python si vous souhaitez 
          # par exemple archiver ou vérifier vos messages stockés sur JSONbin.io
          echo "Vérification effectuée avec succès !"
          
      - name: Inject Secrets into config.js
        run: |
          echo "window.CONFIG_BIN_ID_PAYMENT = '${{ secrets.JSONBIN_ID_PAYMENT }}';" > config.js
          echo "window.CONFIG_API_KEY_PAYMENT = '${{ secrets.JSONBIN_KEY_PAYMENT }}';" >> config.js
