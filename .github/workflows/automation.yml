name: Synchronisation CJ Dropshipping

on:
  schedule:
    - cron: '0 */6 * * *' # S'exécute toutes les 6 heures
  workflow_dispatch: # Permet aussi de le lancer manuellement depuis l'onglet Actions de GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v3

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: pip install requests

      - name: Lancer le script de synchronisation
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }} 
       python update_stock.json

      - name: Sauvegarder et publier le nouveau products.json sur GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "action@github.com"
          git add products.json
          git commit -m "Mise automatique du catalogue et des stocks CJ Dropshipping [skip ci]" || echo "Aucun changement détecté"
          git push
