name: Automatisation Mayah Store

on:
  schedule:
    - cron: '0 */6 * * *' # S'exécute toutes les 6 heures
  workflow_dispatch: # Permet aussi de le lancer manuellement depuis l'onglet Actions de GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          pip install requests

      - name: Lancer le script de synchronisation
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          python update_stock.py
