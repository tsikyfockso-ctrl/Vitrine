name: Automatisation Mayah Store

on:
  schedule:
    # S'exécute automatiquement tous les jours à minuit (00h00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permet de lancer l'action manuellement depuis l'onglet "Actions" de GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances et de Playwright
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Lancement du script de scraping des stocks et détails
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          # Exécute d'abord le scraper principal des produits
          python update_stock.py
          
          # Exécute ensuite le scraper des détails (si vous avez nommé votre second fichier update_product_details.py)
          python update_product_details.py
