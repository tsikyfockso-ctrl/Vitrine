name: Mettre à jour le stock Mayah Store

on:
  schedule:
    - cron: '0 */6 * * *' # Toutes les 6 heures
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: pip install requests

      - name: Exécuter le script de mise à jour
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: python update_stock.json

      - name: Commit et Push de update_stock.json sur GitHub
        run: |
          git config --global user.name "Mayah Bot"
          git config --global user.email "bot@mayahstore.com"
          git add update_stock.json
          git commit -m "Mise à jour automatique de update_stock.json [skip ci]" || echo "Aucun changement"
          git push
