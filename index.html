<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayah Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo-container"></div>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-btn">Accueil</a></li>
            <li><a href="#produits" class="nav-btn">Produits</a></li>
        </ul>
    </nav>

    <header>
        <div class="slideshow-container">
             <h1>Découvrez nos exclusivités</h1>
        <button id="cta-btn">Voir les produits</button>
        <div class="slide"><img src="header/produit en ligne.jpg" alt="Promo 1"></div>
        <div class="slide"><img src="header/produit en ligne 2.jpg" alt="Promo 2"></div>
        <div class="slide"><img src="header/produit en ligne 3.jpg" alt="Promo 3"></div>
        <div class="slide"><img src="header/produit en ligne 4.jpg" alt="Promo 4"></div>
        <div class="slide"><img src="header/produit en ligne 5.jpg" alt="Promo 5"></div>
        <div class="slide"><img src="header/produit en ligne 6.jpg" alt="Promo 6"></div>
        <div class="slide"><img src="header/produit en ligne 7.jpg" alt="Promo 7"></div>
    </div>
    </header>

    <section id="produits">
        <h2>Nos Meilleures Ventes</h2>
        <div class="grid" id="product-container">
            </div>
    </section>

    <script src="script.js"></script>
    <script>
    // Attend que l'image soit chargée
    const logoImg = document.querySelector('.logo-container');
    logoImg.addEventListener('load', function() {
        // Crée un canvas pour analyser les pixels
        const canvas = document.createElement('canvas');
        canvas.width = this.width;
        canvas.height = this.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(this, 0, 0);
        
        // Récupère la couleur du pixel central
        const pixel = ctx.getImageData(this.width/2, this.height/2, 1, 1).data;
        const color = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
        
        // Applique la couleur au nav
        document.querySelector('nav').style.backgroundColor = color;
    });
</script>
</body>
</html>
