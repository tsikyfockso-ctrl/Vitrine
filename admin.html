<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" href="style-admin.css">
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-left">
        <strong>Mayah Store Admin</strong>
        <div id="google_translate_element"></div>
        <div class="nav-right">
        <button id="inboxBtn" class="inbox-btn">Boîte de réception (✉️)</button>
        <button id="logoutBtn" class="logout-btn">Déconnexion</button>
        </div>
    </nav>

    <main>
        <h1>Bienvenue dans votre tableau de bord</h1>
        
        <!-- Boîte de réception déplacée ici pour être bien visible -->
     <div id="inboxModal" class="modal">
        <div class="modal-content">
          <h3>Boîte de réception</h3>
          <div id="inbox-messages"></div>
          <button onclick="closeModal()">Fermer</button>
      </div>
    </main>
        <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
        <script type="text/javascript">
           function googleTranslateElementInit() {
             new google.translate.TranslateElement({
                 pageLanguage: 'fr', 
                 includedLanguages: 'fr,en,es,it,de', 
                 layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                 autoDisplay: false
             }, 'google_translate_element');
        }
    </script>
    <script src="admin.js"></script>
</body>
</html>
