<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" href="style-admin.css">
</head>
<body>

    <nav class="admin-nav">
        <div class="nav-left">
            <strong>Mayah Store Admin</strong>
            </div>
            <!-- ID unique pour le traducteur, dans le flux normal -->
            <div id="google_translate_element"></div>
             <!-- 2. Script Google Translate (placé après admin.js pour sécurité) -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'fr', 
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
        <div class="nav-right">
            <button id="inboxBtn" class="inbox-btn">Boîte de réception</button>
            <button id="logoutBtn" class="logout-btn">Déconnexion</button>
        </div>
    </nav>

    <main>
        
        <!-- Fenêtre modale de la boîte de réception -->
        <div id="inboxModal" class="modal">
            <div class="modal-content">
                <h3>Boîte de réception</h3>
                <div id="inbox-messages"></div>
                <button onclick="closeModal()">Fermer</button>
            </div>
        </div>
        <div class="stock-manager">
    <h3>Gestion de Stock AliExpress</h3>
    <input type="text" id="prodName" placeholder="Nom du produit">
    <input type="number" id="prodPrice" placeholder="Prix">
    <button onclick="addProduct()">Ajouter au stock</button>
    
    <div id="stock-list" style="margin-top: 20px;">
        <!-- La liste des produits apparaîtra ici -->
    </div>
</div>
    </main>

    <!-- 1. Votre script logique -->
    <script src="admin.js"></script>
</body>
</html>
