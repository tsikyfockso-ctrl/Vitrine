<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin</title>
    <style>
        .admin-nav { display: flex; justify-content: space-between; padding: 20px; background: #fff; border-bottom: 2px solid #eee; }
        .logout-btn { background: #f02849; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="admin-nav">
        <strong>Mayah Store Admin</strong>
        <div style="display: flex; align-items: center; gap: 15px;">
        <div id="google_translate_element"></div>
        <button id="logoutBtn" class="logout-btn">Déconnexion</button>
        </div>
    </nav>
    <main style="padding: 20px;">
        <h1>Bienvenue dans votre tableau de bord</h1>
    </main>
    <script src="admin.js"></script>
    <!-- Widget Google Translate -->
<div id="google_translate_element" style="margin-left: 20px;"></div>
   <script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'fr',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
        }, 'google_translate_element');
    }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>
    // Surveillance active pour supprimer la bannière dès qu'elle apparaît
    const hideGoogleBanner = () => {
        const banner = document.querySelector('.goog-te-banner-frame');
        if (banner) {
            banner.remove(); // Supprime complètement l'élément
        }
        // Force le haut de page à rester en place
        document.body.style.top = '0px';
    };

    // Vérifie toutes les 100ms si Google a injecté la bannière
    setInterval(hideGoogleBanner, 100);
</script>
</body>
</html>
