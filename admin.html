<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin</title>
    <style>
        .admin-nav { display: flex; justify-content: space-between; padding: 20px; background: #fff; border-bottom: 2px solid #eee; }
        .logout-btn { background: #f02849; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="admin-nav">
        <strong>Mayah Store Admin</strong>
        <div style="display: flex; align-items: center; gap: 15px;">
        <div id="google_translate_element"></div>
        <button id="logoutBtn" class="logout-btn">Déconnexion</button>
        </div>
    </nav>
    <main style="padding: 20px;">
        <h1>Bienvenue dans votre tableau de bord</h1>
    </main>
    <script src="admin.js"></script>
    <!-- Widget Google Translate -->
<div id="google_translate_element" style="margin-left: 20px;"></div>

<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'fr'}, 'google_translate_element');
}
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script>
    // Observe les modifications du DOM pour supprimer la bannière de Google
    const observer = new MutationObserver((mutations, obs) => {
        const banner = document.querySelector('.goog-te-banner-frame');
        const body = document.body;
        
        if (banner) {
            banner.style.display = 'none';
            // Supprime le décalage imposé par Google sur le body
            body.style.top = '0px';
            body.style.position = 'static';
        }
    });

    observer.observe(document.documentElement, {
        childList: true,
        subtree: true
    });
</script>
</body>
</html>
