<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" href="style-admin.css">
</head>
<body>

    <nav class="admin-nav">
        <div class="nav-left">
            <strong>Mayah Store Admin</strong>
            </div>
            <!-- ID unique pour le traducteur, dans le flux normal -->
            <div id="google_translate_element"></div>
             <!-- 2. Script Google Translate (placé après admin.js pour sécurité) -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'fr', 
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
        <div class="nav-right">
            <button id="inboxBtn" class="inbox-btn">Boîte de réception</button>
            <button id="logoutBtn" class="logout-btn">Déconnexion</button>
        </div>
    </nav>

    <main>
        
        <!-- Fenêtre modale de la boîte de réception -->
        <div id="inboxModal" class="modal">
            <div class="modal-content">

                
                <h3>Boîte de réception</h3>
                <div id="inbox-messages"></div>
                <button onclick="closeModal()">Fermer</button>
            </div>
        </div>
        <div class="stock-manager">
    <h3>Gestion de Stock</h3>
        <div style="margin-bottom: 15px;">
                <label for="adminCategorySelect"><strong>Sélectionner la catégorie à gérer :</strong></label>
                <select id="adminCategorySelect" onchange="changerFichierAdmin()" style="padding: 8px; font-size: 1rem; border-radius: 4px; border: 1px solid #ccc; margin-left: 10px;">
                    <option value="update_stock.json">Vêtements pour Femme (update_stock.json)</option>
                    <option value="update_stock_acc_femme.json">Accessoires pour Femme</option>
                    <option value="update_stock_homme.json">Vêtements pour Homme</option>
                    <option value="update_stock_acc_homme.json">Accessoires pour Homme</option>
                    <option value="update_stock_enfant.json">Vêtements pour Enfant</option>
                    <option value="update_stock_acc_enfant.json">Accessoires pour Enfant</option>
                    <option value="update_stock_sante.json">Santé et Bien-être</option>
                    <option value="update_stock_maison.json">Maison et Meuble</option>
                    <option value="update_stock_electronique.json">Électronique</option>
                    <option value="update_stock_informatique.json">Informatique</option>
                </select>
            </div>
 <!-- Barre de recherche pour le stock -->
    <div style="margin-bottom: 15px;">
        <input type="text" id="stockSearchInput" placeholder="Rechercher par nom de produit ou SKU..." onkeyup="filterStock()" style="width: 100%; max-width: 400px; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;">
    </div>
    <!-- C'est ici que le tableau Excel va s'injecter automatiquement -->
    <div id="stock-list"></div>
</div>
    </main>

    <!-- 1. Votre script logique -->
    <script src="admin.js"></script>
    <script src="script.js"></script>
</body>
</html>
