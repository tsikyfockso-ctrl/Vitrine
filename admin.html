<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" href="style-admin.css">
</head>
<body>
    <nav class="admin-nav">
        <strong>Mayah Store Admin</strong>
        <div id="google_translate_element"></div>
        <button id="logoutBtn" class="logout-btn">Déconnexion</button>
    </nav>

    <main>
        <h1>Bienvenue dans votre tableau de bord</h1>
        
        <!-- Boîte de réception déplacée ici pour être bien visible -->
        <div class="admin-inbox">
            <h3>Boîte de réception</h3>
            <div id="inbox-messages"></div>
        </div>
    </main>

    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'fr', autoDisplay: false}, 'google_translate_element');
        }
    </script>
    <script src="admin.js"></script>
</body>
</html>
